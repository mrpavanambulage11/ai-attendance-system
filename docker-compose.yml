services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/attendance.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-secret-in-production}
      CORS_ORIGINS: http://localhost:5173,http://localhost:80
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@attendance.io}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    volumes:
      - backend-data:/app/data
      - backend-faces:/app/storage/faces

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
  backend-faces:
