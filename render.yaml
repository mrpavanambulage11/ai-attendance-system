services:
  - type: web
    name: ai-attendance-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@attendance.io
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: System Admin
      - key: CORS_ORIGINS
        value: "*"
